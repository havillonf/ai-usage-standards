# Configuração do verificador de links (https://lychee.cli.rs/).
scheme = ["https"]
accept = ["200..=299", "403", "429"]
max_retries = 3
timeout = 30
exclude = [
  # Exemplos de configuração e marcadores, não são páginas.
  "^https://opencode\\.ai/config\\.json$",
  "^https://mcp\\.exemplo\\.com",
  "^https://exemplo",
  # Endereços de servidores MCP: são endpoints, não páginas (respondem 401/405 a um GET).
  "^https://mcp\\.",
  "^https://nuxt\\.com/mcp$",
  "^https://learn\\.microsoft\\.com/api/mcp$",
]
